<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Küchen-Display</title>
<style>
:root {
  --bg:        #0d0d0d;
  --surface:   #1a1a1a;
  --surface2:  #222;
  --border:    #2e2e2e;
  --text:      #f0f0f0;
  --muted:     #777;
  --green:     #00c896;
  --yellow:    #ffc107;
  --orange:    #ff7043;
  --red:       #f44336;
  --purple:    #9c6eff;
  --blue:      #448aff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ─────────────────────────────── */
header {
  background: #111;
  border-bottom: 2px solid var(--border);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 12px;
  user-select: none;
}

.logo { font-size: 1.25rem; font-weight: 800; color: var(--green); letter-spacing: 1px; }

.conn-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.72rem; color: var(--muted);
}
.conn-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--red);
  transition: background 0.4s;
}
.conn-dot.on { background: var(--green); }

.header-stats { display: flex; gap: 28px; }
.stat { text-align: center; }
.stat-val  { font-size: 1.5rem; font-weight: 800; line-height: 1; }
.stat-lbl  { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 1px; }
.stat-val.warn { color: var(--yellow); }
.stat-val.alert { color: var(--red); }

.clock {
  font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums;
  color: var(--muted); min-width: 78px; text-align: right;
}

/* ── FILTER BAR ─────────────────────────── */
.filters {
  background: #111; border-bottom: 1px solid var(--border);
  padding: 7px 20px; display: flex; gap: 7px; overflow-x: auto;
}
.filters::-webkit-scrollbar { height: 0; }

.fbtn {
  padding: 4px 14px; border-radius: 20px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); cursor: pointer; font-size: 0.78rem;
  white-space: nowrap; transition: all 0.15s;
}
.fbtn:hover, .fbtn.active {
  background: var(--green); border-color: var(--green); color: #000; font-weight: 700;
}

/* ── GRID ───────────────────────────────── */
.grid {
  padding: 14px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
  gap: 12px;
  align-items: start;
  flex: 1;
}

.empty {
  grid-column: 1/-1; text-align: center;
  padding: 80px 20px; color: var(--muted);
}
.empty-icon { font-size: 3rem; margin-bottom: 12px; }
.empty-txt  { font-size: 1rem; }

/* ── ORDER CARD ─────────────────────────── */
.card {
  background: var(--surface);
  border-radius: 10px;
  border: 1px solid var(--border);
  border-left: 5px solid var(--green);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: border-color 0.4s, box-shadow 0.4s;
}

.card[data-urgency="1"] { border-left-color: var(--yellow); }
.card[data-urgency="2"] { border-left-color: var(--orange); }
.card[data-urgency="3"] {
  border-left-color: var(--red);
  animation: pulse 1.6s ease-in-out infinite;
}
.card[data-status="ready"] {
  border-left-color: var(--purple);
  box-shadow: 0 0 14px rgba(156, 110, 255, 0.25);
}

@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(244,67,54,.5); }
  50%      { box-shadow: 0 0 0 7px rgba(244,67,54,0); }
}

/* Card header */
.card-hd {
  padding: 9px 12px; background: var(--surface2);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
}
.order-num  { font-size: 1.35rem; font-weight: 900; line-height: 1; }
.table-num  { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
.card-time  { text-align: right; }
.timer      { display: block; font-size: 1.1rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.srv-name   { font-size: 0.68rem; color: var(--muted); }

/* Items */
.card-items { padding: 6px 12px; flex: 1; }

.item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 7px 4px; border-bottom: 1px solid rgba(255,255,255,.05);
  cursor: pointer; border-radius: 5px;
  transition: background 0.12s;
}
.item:last-child { border-bottom: none; }
.item:hover { background: rgba(255,255,255,.04); }

.item.done .item-name,
.item.done .item-qty { opacity: 0.3; text-decoration: line-through; }

.check {
  flex-shrink: 0; margin-top: 2px;
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.6rem; transition: all 0.2s;
}
.item.done .check { background: var(--green); border-color: var(--green); color: #000; }
.item.done .check::after { content: '✓'; font-weight: 900; }

.item-qty  { font-weight: 800; color: var(--yellow); min-width: 22px; font-size: 0.9rem; }
.item-body { flex: 1; }
.item-name { font-size: 0.95rem; font-weight: 500; }

.mods { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
.mod  {
  font-size: 0.68rem; padding: 1px 7px;
  background: rgba(255,255,255,.07); border-radius: 10px; color: var(--muted);
}

.item-note { font-size: 0.73rem; color: var(--orange); margin-top: 2px; font-style: italic; }

.station-tag {
  font-size: 0.62rem; padding: 1px 5px;
  background: rgba(68,138,255,.15); color: var(--blue);
  border-radius: 3px; text-transform: uppercase; letter-spacing: 0.4px;
  font-weight: 700; margin-left: 5px; vertical-align: middle;
}

/* Order notes */
.card-note {
  margin: 0 12px 8px; padding: 6px 10px;
  background: rgba(255,112,67,.1); border-left: 3px solid var(--orange);
  border-radius: 4px; font-size: 0.78rem; color: var(--orange);
}

/* Footer */
.card-ft {
  padding: 8px 12px; background: var(--surface2);
  display: flex; justify-content: space-between; align-items: center;
}
.progress { font-size: 0.7rem; color: var(--muted); }

.badge {
  font-size: 0.7rem; font-weight: 700;
  padding: 3px 10px; border-radius: 12px;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.badge.new        { background: rgba(0,200,150,.15); color: var(--green); }
.badge.in_progress{ background: rgba(255,193,7,.15);  color: var(--yellow); }
.badge.ready      { background: rgba(156,110,255,.2); color: var(--purple); }

.btn-bump {
  padding: 7px 16px; background: var(--green); color: #000;
  border: none; border-radius: 6px; font-weight: 900; font-size: 0.82rem;
  cursor: pointer; letter-spacing: 0.3px; transition: all 0.12s;
}
.btn-bump:hover  { background: #00e0a8; transform: translateY(-1px); }
.btn-bump:active { transform: none; }

.btn-waiting {
  padding: 6px 12px; background: rgba(156,110,255,.12); color: var(--purple);
  border: 1px solid rgba(156,110,255,.4); border-radius: 6px;
  font-weight: 700; font-size: 0.75rem; cursor: default; letter-spacing: 0.2px;
}
.btn-skip {
  padding: 6px 9px; background: transparent; color: var(--muted);
  border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem;
  cursor: pointer; transition: all 0.12s; margin-left: 5px;
}
.btn-skip:hover { border-color: var(--red); color: var(--red); }

.btn-almost {
  padding: 7px 12px; background: rgba(255,193,7,.15); color: var(--yellow);
  border: 1px solid rgba(255,193,7,.4); border-radius: 6px;
  font-weight: 800; font-size: 0.78rem; cursor: pointer;
  letter-spacing: 0.2px; transition: all 0.12s;
}
.btn-almost:hover { background: rgba(255,193,7,.3); }

.card[data-status="almost_ready"] {
  border-left-color: var(--yellow);
  box-shadow: 0 0 10px rgba(255,193,7,.15);
}

.cutlery-status {
  font-size: 0.75rem; font-weight: 700;
  display: flex; align-items: center; gap: 4px;
}

/* Animations */
@keyframes flash-new {
  0%   { box-shadow: 0 0 0 0 rgba(0,200,150,.9); }
  100% { box-shadow: 0 0 0 18px rgba(0,200,150,0); }
}
.new-flash { animation: flash-new 0.7s ease-out !important; }

@keyframes fadeout {
  to { opacity: 0; transform: scale(0.9); }
}
.removing { animation: fadeout 0.28s ease-in forwards; }

/* Toasts */
.toast-wrap {
  position: fixed; top: 76px; right: 14px; z-index: 500;
  display: flex; flex-direction: column; gap: 7px; pointer-events: none;
}
.toast {
  background: var(--surface2); border: 1px solid var(--border);
  border-left: 3px solid var(--green); padding: 9px 15px;
  border-radius: 8px; font-size: 0.82rem; max-width: 270px;
  animation: slide-in 0.2s ease-out;
}
@keyframes slide-in { from { transform: translateX(110%); opacity:0; } to { transform:none; opacity:1; } }
@keyframes slide-out{ to   { transform: translateX(110%); opacity:0; } }
.toast.out { animation: slide-out 0.2s ease-in forwards; }

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:18px">
    <div class="logo">&#127859; KÜCHE</div>
    <a href="/ausgabe.html" target="_blank" style="font-size:0.75rem;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:4px 10px;border-radius:6px;">&#8599; Ausgabe-Display</a>
    <div class="conn-badge">
      <div class="conn-dot" id="dot"></div>
      <span id="conn-lbl">Verbinde…</span>
    </div>
  </div>

  <div class="header-stats">
    <div class="stat">
      <div class="stat-val" id="s-active">0</div>
      <div class="stat-lbl">Aktiv</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="s-ready">0</div>
      <div class="stat-lbl">Bereit</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="s-avg">—</div>
      <div class="stat-lbl">&#216; Wartezeit</div>
    </div>
  </div>

  <div class="clock" id="clock"></div>
</header>

<div class="filters" id="filters">
  <button class="fbtn active" data-s="all">Alle</button>
</div>

<main class="grid" id="grid"></main>

<div class="toast-wrap" id="toasts"></div>

<script>
// ── State ────────────────────────────────────────────────────
let orders      = {};
let station     = 'all';
let audioCtx    = null;
let ws          = null;
let cfg         = { urgencyYellow: 5, urgencyOrange: 10, urgencyRed: 15 };

// ── WebSocket ─────────────────────────────────────────────────
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}`);

  ws.onopen  = () => setConn(true);
  ws.onclose = () => { setConn(false); setTimeout(connect, 3000); };
  ws.onerror = () => ws.close();
  ws.onmessage = e => handle(JSON.parse(e.data));
}

function setConn(ok) {
  document.getElementById('dot').classList.toggle('on', ok);
  document.getElementById('conn-lbl').textContent = ok ? 'Verbunden' : 'Getrennt – verbinde…';
}

function applySettings(s) {
  if (!s) return;
  if (s.kitchen) Object.assign(cfg, s.kitchen);
  if (s.restaurant) {
    const el = document.querySelector('.logo');
    if (el) el.textContent = (s.restaurant.logo || '🍳') + ' ' + (s.restaurant.name || 'KÜCHE');
  }
}

function handle(msg) {
  switch (msg.type) {
    case 'init':
      orders = {};
      msg.orders.forEach(o => orders[o.id] = o);
      applySettings(msg.settings);
      renderAll();
      break;
    case 'settings_updated':
      applySettings(msg.settings);
      break;
    case 'order_new':
      orders[msg.order.id] = msg.order;
      renderAll();
      setTimeout(() => flash(msg.order.id), 40);
      beep();
      toast(`Neue Bestellung #${msg.order.order_number}${msg.order.table_number ? '  •  Tisch ' + msg.order.table_number : ''}`);
      break;
    case 'order_updated':
      orders[msg.order.id] = msg.order;
      refreshCard(msg.order);
      break;
    case 'order_completed':
      delete orders[msg.orderId];
      removeCard(msg.orderId);
      break;
  }
  updateStats();
}

// ── Sound ─────────────────────────────────────────────────────
function beep() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      const g   = audioCtx.createGain();
      osc.connect(g); g.connect(audioCtx.destination);
      osc.type = 'sine'; osc.frequency.value = f;
      const t = audioCtx.currentTime + i * 0.15;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.3, t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.44);
      osc.start(t); osc.stop(t + 0.5);
    });
  } catch (_) {}
}
document.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}, { once: true });

// ── Helpers ───────────────────────────────────────────────────
const esc = s => s == null ? '' : String(s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function elapsed(createdAt) {
  return Math.floor((Date.now() - new Date(createdAt).getTime()) / 1000);
}
function fmt(sec) {
  return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
}
function urgency(sec, status) {
  if (status === 'ready') return -1;
  if (sec < cfg.urgencyYellow * 60) return 0;
  if (sec < cfg.urgencyOrange * 60) return 1;
  if (sec < cfg.urgencyRed   * 60) return 2;
  return 3;
}

// ── Build card HTML ───────────────────────────────────────────
function buildCard(o) {
  const sec  = elapsed(o.created_at);
  const urg  = urgency(sec, o.status);
  const done = o.items.filter(i => i.status === 'done').length;
  const lbl  = { new:'Neu', in_progress:'In Arbeit', almost_ready:'Fast fertig', ready:'Bereit' };

  const itemsHtml = o.items.map(item => `
    <div class="item${item.status==='done'?' done':''}"
         onclick="toggleItem(${o.id},${item.id})"
         data-iid="${item.id}">
      <div class="check"></div>
      <span class="item-qty">${item.quantity}&times;</span>
      <div class="item-body">
        <span class="item-name">${esc(item.name)}${
          item.station && item.station !== 'küche'
            ? `<span class="station-tag">${esc(item.station)}</span>` : ''
        }</span>
        ${item.modifiers?.length
          ? `<div class="mods">${item.modifiers.map(m=>`<span class="mod">${esc(m)}</span>`).join('')}</div>`
          : ''}
        ${item.notes ? `<div class="item-note">&#128221; ${esc(item.notes)}</div>` : ''}
      </div>
    </div>`).join('');

  return `
    <div class="card" id="c${o.id}"
         data-id="${o.id}" data-status="${o.status}"
         data-urgency="${urg}" data-created="${o.created_at}">
      <div class="card-hd">
        <div>
          <div class="order-num">#${esc(o.order_number)}</div>
          ${o.table_number ? `<div class="table-num">Tisch ${esc(o.table_number)}</div>` : ''}
        </div>
        <div class="card-time">
          <span class="timer">${fmt(sec)}</span>
          ${o.server_name ? `<span class="srv-name">${esc(o.server_name)}</span>` : ''}
        </div>
      </div>
      <div class="card-items">${itemsHtml}</div>
      ${o.notes ? `<div class="card-note">&#9888; ${esc(o.notes)}</div>` : ''}
      <div class="card-ft">
        <div>
          <span class="badge ${o.status}">${lbl[o.status]||o.status}</span>
          <span class="progress">&nbsp;${done}/${o.items.length} &#10003;</span>
        </div>
        ${o.status === 'ready'
          ? `<div style="display:flex;align-items:center">
               <button class="btn-waiting">&#9203; Wartet auf Kellner</button>
               <button class="btn-skip" onclick="skipBump(${o.id})" title="Direkt abschließen">&#10006;</button>
             </div>`
          : o.status === 'almost_ready'
          ? `<div style="display:flex;align-items:center;gap:10px">
               <span class="cutlery-status" style="color:${o.cutlery_confirmed ? 'var(--green)' : 'var(--yellow)'}">
                 &#127860; ${o.cutlery_confirmed ? 'Besteck &#10003;' : 'Besteck ausstehend'}
               </span>
               <button class="btn-bump" onclick="bump(${o.id})">FERTIG &#10003;</button>
             </div>`
          : `<div style="display:flex;gap:7px">
               <button class="btn-almost" onclick="almostReady(${o.id})">&#127860; FAST FERTIG</button>
               <button class="btn-bump" onclick="bump(${o.id})">FERTIG &#10003;</button>
             </div>`
        }
      </div>
    </div>`;
}

// ── Render ────────────────────────────────────────────────────
function filtered() {
  return Object.values(orders)
    .filter(o => station === 'all' || o.items.some(i => i.station === station))
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
}

function renderAll() {
  const list = filtered();
  const grid = document.getElementById('grid');
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">&#127374;</div><div class="empty-txt">Keine aktiven Bestellungen</div></div>`;
  } else {
    grid.innerHTML = list.map(buildCard).join('');
  }
  rebuildFilters();
  updateStats();
}

function refreshCard(o) {
  const el = document.getElementById(`c${o.id}`);
  if (!el) { renderAll(); return; }
  const tmp = document.createElement('div');
  tmp.innerHTML = buildCard(o);
  el.replaceWith(tmp.firstElementChild);
}

function removeCard(id) {
  const el = document.getElementById(`c${id}`);
  if (!el) return;
  el.classList.add('removing');
  setTimeout(() => {
    el.remove();
    if (!document.getElementById('grid').children.length) renderAll();
  }, 300);
}

function flash(id) {
  const el = document.getElementById(`c${id}`);
  if (!el) return;
  el.classList.add('new-flash');
  setTimeout(() => el.classList.remove('new-flash'), 750);
}

// ── Timers ────────────────────────────────────────────────────
setInterval(() => {
  document.querySelectorAll('.card').forEach(card => {
    const id  = +card.dataset.id;
    const o   = orders[id];
    if (!o) return;
    const sec = elapsed(card.dataset.created);
    const t   = card.querySelector('.timer');
    if (t) t.textContent = fmt(sec);
    card.dataset.urgency = urgency(sec, o.status);
  });
  updateStats();
}, 1000);

function updateStats() {
  const list = Object.values(orders);
  const readyN = list.filter(o => o.status === 'ready').length;

  let avgTxt = '—';
  if (list.length) {
    const avg = list.reduce((s, o) => s + elapsed(o.created_at), 0) / list.length;
    const m   = Math.floor(avg / 60);
    avgTxt    = m + ' min';
    const av  = document.getElementById('s-avg');
    av.className = 'stat-val' + (m >= 15 ? ' alert' : m >= 10 ? ' warn' : '');
  }

  document.getElementById('s-active').textContent = list.length;
  document.getElementById('s-ready').textContent  = readyN;
  document.getElementById('s-avg').textContent    = avgTxt;
}

// ── Clock ─────────────────────────────────────────────────────
function tick() {
  const n = new Date();
  document.getElementById('clock').textContent =
    [n.getHours(), n.getMinutes(), n.getSeconds()]
      .map(v => String(v).padStart(2,'0')).join(':');
}
setInterval(tick, 1000); tick();

// ── Interactions ──────────────────────────────────────────────
function toggleItem(orderId, itemId) {
  const o    = orders[orderId];
  if (!o) return;
  const item = o.items.find(i => i.id === itemId);
  if (!item) return;

  const next = item.status === 'done' ? 'pending' : 'done';
  item.status = next;

  const allDone = o.items.every(i => i.status === 'done');
  const anyDone = o.items.some(i  => i.status === 'done');
  o.status = allDone ? 'ready' : anyDone ? 'in_progress' : 'new';

  refreshCard(o);

  fetch(`/api/orders/${orderId}/items/${itemId}/status`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: next }),
  }).catch(console.error);
}

function bump(orderId) {
  const o = orders[orderId];
  if (!o) return;
  // Mark all items done + status ready → appears on Ausgabe-Display
  o.items.forEach(i => i.status = 'done');
  o.status = 'ready';
  refreshCard(o);
  fetch(`/api/orders/${orderId}/status`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'ready' }),
  }).catch(console.error);
}

function almostReady(orderId) {
  const o = orders[orderId];
  if (!o) return;
  o.status = 'almost_ready';
  refreshCard(o);
  fetch(`/api/orders/${orderId}/status`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: 'almost_ready' }),
  }).catch(console.error);
}

function skipBump(orderId) {
  delete orders[orderId];
  removeCard(orderId);
  updateStats();
  fetch(`/api/orders/${orderId}`, { method: 'DELETE' }).catch(console.error);
}

// ── Station filters ───────────────────────────────────────────
const stationLabels = {
  all: 'Alle', küche: 'Küche', grill: 'Grill',
  cold: 'Kalt', bar: 'Bar', dessert: 'Dessert',
};

function rebuildFilters() {
  const set = new Set(['all']);
  Object.values(orders).forEach(o => o.items.forEach(i => i.station && set.add(i.station)));
  document.getElementById('filters').innerHTML = [...set].map(s =>
    `<button class="fbtn${s===station?' active':''}" onclick="setStation('${s}')">${stationLabels[s]||s}</button>`
  ).join('');
}

function setStation(s) { station = s; renderAll(); }

// ── Toast ─────────────────────────────────────────────────────
function toast(msg) {
  const box = document.getElementById('toasts');
  const el  = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 220);
  }, 3500);
}

// ── Boot ──────────────────────────────────────────────────────
renderAll();
connect();
</script>
</body>
</html>
